<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sistema NPS</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="atendente-page">

  <div class="container">
    <div class="topo-atendente">
      <div>
        <h1 class="saudacao-atendente" id="saudacaoAtendente">Olá</h1>
        <div class="frase-atendente" id="fraseAtendente">Tenha um ótimo dia!</div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button onclick="logout()">Sair</button>
      </div>
    </div>

    <div class="dashboard-atendente">
      <div class="dashboard-bloco">
        <div class="dashboard-titulo">Desempenho do mês</div>
        <div class="dashboard-cards">
          <div class="dashboard-card">
            <span class="dashboard-label">Total do mês</span>
            <span class="dashboard-valor" id="dashMes">0</span>
          </div>
          <div id="dashMesStatusOrdenados" class="dashboard-cards-extra"></div>
        </div>
      </div>

      <div class="dashboard-bloco">
        <div class="dashboard-titulo">Desempenho do dia</div>
        <div class="dashboard-cards">
          <div class="dashboard-card">
            <span class="dashboard-label">Total de hoje</span>
            <span class="dashboard-valor" id="dashHoje">0</span>
          </div>
          <div id="dashHojeStatusOrdenados" class="dashboard-cards-extra"></div>
        </div>
      </div>

      <div class="dashboard-bloco">
        <div class="dashboard-titulo">Fila</div>
        <div class="dashboard-cards">
          <div class="dashboard-card">
            <span class="dashboard-label">1º contato</span>
            <span class="dashboard-valor" id="filaContato1">0</span>
          </div>
          <div class="dashboard-card">
            <span class="dashboard-label">2º contato</span>
            <span class="dashboard-valor" id="filaContato2">0</span>
          </div>
          <div class="dashboard-card">
            <span class="dashboard-label">3º contato</span>
            <span class="dashboard-valor" id="filaContato3">0</span>
          </div>
          <div class="dashboard-card alerta">
            <span class="dashboard-label">Último contato</span>
            <span class="dashboard-valor" id="filaUltimoContato">0</span>
          </div>
          <div class="dashboard-card">
            <span class="dashboard-label">Retornos</span>
            <span class="dashboard-valor" id="filaRetornos">0</span>
          </div>
          <div class="dashboard-card">
            <span class="dashboard-label">Tratativas</span>
            <span class="dashboard-valor" id="filaTratativas">0</span>
          </div>
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Bairro</th>
          <th>Data</th>
          <th>Retorno</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela">
        <tr>
          <td colspan="6" style="text-align:center; color:#666;">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="app-common.js"></script>

  <script>
    let usuarioLogado = exigirUsuarioLogado();
    let atendimentos = [];

    document.getElementById("saudacaoAtendente").innerText =
      "Olá " + (usuarioLogado.nome || usuarioLogado.usuario || "") + " 😄";

    function obterFraseDoDia() {
      const dia = new Date().getDay();

      if (dia === 0) return "Bom fim de semana! 🌞";
      if (dia === 1 || dia === 2) return "Tenha uma ótima semana! 🚀";
      if (dia === 3) return "Metade da semana! Vamos com tudo! 🎯";
      if (dia === 4) return "Falta pouco para o fim de semana. 💙";
      if (dia === 5) return "Sextou! Vamos fechar bem a semana. Falta pouco! 🚀";
      if (dia === 6) return "Tenha um ótimo fim de semana! 🎉";

      return "Tenha um ótimo dia!";
    }

    document.getElementById("fraseAtendente").innerText = obterFraseDoDia();

    function normalizarTipo(tipo) {
      let texto = normalizarTexto(tipo).replace(/-/g, " ");

      if (texto.includes("venda")) return "Pós Venda";
      if (texto.includes("suporte")) return "Pós Suporte";
      return tipo || "";
    }

    function hojeISO() {
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, "0");
      const dia = String(hoje.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function inicioMesISO() {
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, "0");
      return `${ano}-${mes}-01`;
    }

    function atualizarTexto(id, valor) {
      const elemento = document.getElementById(id);
      if (elemento) elemento.innerText = valor;
    }

    function statusCampanha(status) {
      const s = normalizarTexto(status);
      return ["realizada", "nao_quis", "sem_contato"].includes(s);
    }

    function ehStatus(status, esperado) {
      return normalizarTexto(status) === esperado;
    }

    function montarCardResultado(label, valor) {
      return `
        <div class="dashboard-card">
          <span class="dashboard-label">${label}</span>
          <span class="dashboard-valor">${valor}</span>
        </div>
      `;
    }

    function atualizarCardsResultado(containerId, contagens) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const cards = [
        { label: "Realizadas", valor: contagens.realizadas },
        { label: "Não quis realizar", valor: contagens.naoQuis },
        { label: "Sem contato", valor: contagens.semContato }
      ].sort(function(a, b) {
        return b.valor - a.valor;
      });

      container.innerHTML = cards.map(function(card) {
        return montarCardResultado(card.label, card.valor);
      }).join("");
    }

    async function carregarDashboardAtendente() {
      const nomeAtendente = usuarioLogado.nome || usuarioLogado.usuario || "";
      const inicioMes = inicioMesISO();
      const hoje = hojeISO();

      const { data, error } = await supabaseClient
        .from("respostas")
        .select("atendente, status, data")
        .gte("data", inicioMes)
        .lte("data", hoje)
        .order("id", { ascending: true });

      if (error) {
        console.error("Erro ao carregar dashboard do atendente:", error);
        return;
      }

      const respostasAtendente = (data || []).filter(function(item) {
        return normalizarTexto(item.atendente) === normalizarTexto(nomeAtendente);
      });

      const respostasCampanha = respostasAtendente.filter(function(item) {
        return statusCampanha(item.status);
      });

      const respostasHoje = respostasAtendente.filter(function(item) {
        return item.data === hoje;
      });

      const contagensMes = {
        realizadas: respostasAtendente.filter(item => ehStatus(item.status, "realizada")).length,
        naoQuis: respostasAtendente.filter(item => ehStatus(item.status, "nao_quis")).length,
        semContato: respostasAtendente.filter(item => ehStatus(item.status, "sem_contato")).length
      };

      const contagensHoje = {
        realizadas: respostasHoje.filter(item => ehStatus(item.status, "realizada")).length,
        naoQuis: respostasHoje.filter(item => ehStatus(item.status, "nao_quis")).length,
        semContato: respostasHoje.filter(item => ehStatus(item.status, "sem_contato")).length
      };

      atualizarTexto("dashHoje", respostasCampanha.filter(item => item.data === hoje).length);
      atualizarTexto("dashMes", respostasCampanha.length);
      atualizarCardsResultado("dashMesStatusOrdenados", contagensMes);
      atualizarCardsResultado("dashHojeStatusOrdenados", contagensHoje);
    }

    function atualizarResumoFila(lista) {
      const resumo = {
        contato1: 0,
        contato2: 0,
        contato3: 0,
        ultimoContato: 0,
        retornos: 0,
        tratativas: 0
      };

      (lista || []).forEach(function(item) {
        const tentativas = Number(item.tentativas_sem_contato || 0);

        if (item.eh_tratativa) {
          resumo.tratativas += 1;
          return;
        }

        if (item.horario_retorno) {
          resumo.retornos += 1;
          return;
        }

        if (tentativas <= 0) resumo.contato1 += 1;
        else if (tentativas === 1) resumo.contato2 += 1;
        else if (tentativas === 2) resumo.contato3 += 1;
        else resumo.ultimoContato += 1;
      });

      atualizarTexto("filaContato1", resumo.contato1);
      atualizarTexto("filaContato2", resumo.contato2);
      atualizarTexto("filaContato3", resumo.contato3);
      atualizarTexto("filaUltimoContato", resumo.ultimoContato);
      atualizarTexto("filaRetornos", resumo.retornos);
      atualizarTexto("filaTratativas", resumo.tratativas);
    }

    async function buscarInfoPendencia(nomesClientes) {
      if (!nomesClientes || nomesClientes.length === 0) {
        return {};
      }

      const { data, error } = await supabaseClient
        .from("respostas")
        .select("cliente, status, horario_retorno, tipo_retorno, necessita_tratativa, motivo_tratativa")
        .in("cliente", nomesClientes)
        .order("id", { ascending: false });

      if (error) {
        console.error("Erro ao buscar informações de retorno/tratativa:", error);
        return {};
      }

      const mapa = {};

      (data || []).forEach(function(item) {
        const chave = item.cliente || "";
        if (!mapa[chave]) {
          const statusTexto = String(item.status || "");
          const ehTratativa =
            String(item.necessita_tratativa || "").toLowerCase() === "sim" ||
            statusTexto.startsWith("tratativa");

          mapa[chave] = {
            horario: item.horario_retorno || "",
            tipo: item.tipo_retorno || "",
            ehTratativa: ehTratativa,
            motivo: item.motivo_tratativa || ""
          };
        }
      });

      return mapa;
    }

    async function carregarClientes() {
      let tabela = document.getElementById("tabela");
      tabela.innerHTML = `
        <tr>
          <td colspan="6" style="text-align:center; color:#666;">Carregando...</td>
        </tr>
      `;

      let { data, error } = await supabaseClient
        .from("clientes")
        .select("*")
        .eq("status_pesquisa", "pendente")
        .order("id", { ascending: true });

      if (error) {
        console.error("Erro ao carregar clientes:", error);
        tabela.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color:#b91c1c;">
              Erro ao carregar clientes: ${error.message}
            </td>
          </tr>
        `;
        return;
      }

      let lista = data || [];

      if (usuarioLogado.perfil === "atendente") {
        const nomeUsuario = normalizarTexto(usuarioLogado.nome || usuarioLogado.usuario);

        lista = lista.filter(function(item) {
          const nomeBanco = normalizarTexto(item.atendente_responsavel);
          return nomeBanco === nomeUsuario;
        });
      }

      const nomesClientesTodos = lista.map(function(item) {
        return item.nome || "";
      }).filter(Boolean);

      const mapaInfos = await buscarInfoPendencia(nomesClientesTodos);

      const listaComInfo = lista.map(function(item) {
        const info = mapaInfos[item.nome || ""] || {};

        return {
          id: item.id,
          codigo: item.codigo || "",
          nome: item.nome || "",
          bairro: item.bairro || "",
          telefone: item.telefone || "",
          email: item.email || "",
          data: item.data || "",
          vendedor: item.vendedor || "",
          tecnico: item.tecnico || "",
          tipo: normalizarTipo(item.tipo),
          endereco: item.endereco || "",
          atendente_responsavel: item.atendente_responsavel || "",
          status_pesquisa: item.status_pesquisa || "",
          tentativas_sem_contato: Number(item.tentativas_sem_contato || 0),
          ultima_tentativa_por: item.ultima_tentativa_por || "",
          horario_retorno: info.horario || "",
          tipo_retorno: info.tipo || "",
          eh_tratativa: info.ehTratativa || false,
          motivo_tratativa: info.motivo || ""
        };
      });

      const acompanhamento = listaComInfo.filter(function(item) {
        return (
          !!item.horario_retorno ||
          item.eh_tratativa === true ||
          Number(item.tentativas_sem_contato || 0) > 0 ||
          !!item.ultima_tentativa_por
        );
      });

      const novos = listaComInfo.filter(function(item) {
        return !(
          !!item.horario_retorno ||
          item.eh_tratativa === true ||
          Number(item.tentativas_sem_contato || 0) > 0 ||
          !!item.ultima_tentativa_por
        );
      });

      atendimentos = [
        ...acompanhamento,
        ...novos.slice(0, 5)
      ];

      atualizarResumoFila(atendimentos);
      carregarTabela(atendimentos);
    }

    function montarTextoRetorno(item) {
      let textoBase = "";

      if (item.horario_retorno) {
        if (item.tipo_retorno === "apos") {
          textoBase = `Após ${item.horario_retorno}`;
        } else {
          textoBase = `Às ${item.horario_retorno}`;
        }
      }

      if (item.eh_tratativa) {
        if (textoBase) {
          return `Tratativa necessária<span class="texto-menor">${textoBase}</span>`;
        }
        return `Tratativa necessária`;
      }

      return textoBase;
    }

    function montarAvisoTentativa(item) {
      const tentativas = Number(item.tentativas_sem_contato || 0);
      const ehTratativa = item.eh_tratativa === true;
      const ehRetorno = !!item.horario_retorno && !ehTratativa;

      if (ehTratativa) {
        return {
          texto: tentativas >= 1 ? "Última tentativa de tratativa" : "1ª tentativa de tratativa",
          ultimo: tentativas >= 1
        };
      }

      if (ehRetorno) {
        return {
          texto: tentativas >= 1 ? "2ª tentativa de retorno" : "1ª tentativa de retorno",
          ultimo: tentativas >= 1
        };
      }

      if (tentativas >= 3) {
        return {
          texto: "4º contato - último contato",
          ultimo: true
        };
      }

      return {
        texto: (tentativas + 1) + "º contato",
        ultimo: false
      };
    }

    function carregarTabela(lista) {
      let tabela = document.getElementById("tabela");
      tabela.innerHTML = "";

      if (!lista || lista.length === 0) {
        tabela.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color:#666;">
              Nenhum atendimento pendente encontrado.
            </td>
          </tr>
        `;
        return;
      }

      lista.forEach(function(a) {
        let textoRetorno = montarTextoRetorno(a);
        let classeRetorno = (a.horario_retorno || a.eh_tratativa) ? "retorno-amarelo" : "";
        let modo = a.eh_tratativa ? "tratativa" : "normal";
        let avisoTentativa = montarAvisoTentativa(a);

        let linha = `
          <tr>
            <td>${a.codigo}</td>
            <td>
              <span class="aviso-tentativa ${avisoTentativa.ultimo ? "ultimo" : ""}">${avisoTentativa.texto}</span>
              <span class="nome-cliente">${a.nome}</span>
            </td>
            <td>${a.bairro}</td>
            <td>${formatarDataBR(a.data)}</td>
            <td class="${classeRetorno}">${textoRetorno}</td>
            <td>
              <button onclick="realizarPesquisa(
                '${a.id}',
                '${String(a.codigo).replace(/'/g, "\\'")}',
                '${String(a.nome).replace(/'/g, "\\'")}',
                '${String(a.bairro).replace(/'/g, "\\'")}',
                '${String(a.telefone).replace(/'/g, "\\'")}',
                '${String(a.email).replace(/'/g, "\\'")}',
                '${String(a.data).replace(/'/g, "\\'")}',
                '${String(a.vendedor).replace(/'/g, "\\'")}',
                '${String(a.tecnico).replace(/'/g, "\\'")}',
                '${String(a.tipo).replace(/'/g, "\\'")}',
                '${String(a.endereco).replace(/'/g, "\\'")}',
                '${String(modo).replace(/'/g, "\\'")}',
                '${String(a.motivo_tratativa || "").replace(/'/g, "\\'")}',
                '${String(a.horario_retorno || "").replace(/'/g, "\\'")}',
                '${String(a.tipo_retorno || "").replace(/'/g, "\\'")}'
              )">
                Realizar
              </button>
            </td>
          </tr>
        `;

        tabela.innerHTML += linha;
      });
    }

    function filtrarTipo(tipo) {
      if (tipo === "todos") {
        carregarTabela(atendimentos);
        return;
      }

      let filtrados = atendimentos.filter(function(a) {
        return a.tipo === tipo;
      });

      carregarTabela(filtrados);
    }

    function realizarPesquisa(id, codigo, nome, bairro, telefone, email, data, vendedor, tecnico, tipo, endereco, modo, motivoTratativa, horarioRetorno, tipoRetorno) {
      window.location.href =
        "pesquisa.html?id=" + encodeURIComponent(id) +
        "&codigo=" + encodeURIComponent(codigo) +
        "&nome=" + encodeURIComponent(nome) +
        "&bairro=" + encodeURIComponent(bairro) +
        "&telefone=" + encodeURIComponent(telefone) +
        "&email=" + encodeURIComponent(email) +
        "&data=" + encodeURIComponent(data) +
        "&vendedor=" + encodeURIComponent(vendedor) +
        "&tecnico=" + encodeURIComponent(tecnico) +
        "&tipo=" + encodeURIComponent(tipo) +
        "&endereco=" + encodeURIComponent(endereco) +
        "&modo=" + encodeURIComponent(modo || "normal") +
        "&motivoTratativa=" + encodeURIComponent(motivoTratativa || "") +
        "&horarioRetorno=" + encodeURIComponent(horarioRetorno || "") +
        "&tipoRetorno=" + encodeURIComponent(tipoRetorno || "");
    }

    carregarDashboardAtendente();
    carregarClientes();
  </script>

</body>
</html>
